<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#212121">
  <meta name="description" content="OuškoAI – chytrý liščí společník.">
  <title>OuškoAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root{color-scheme:dark;--bg:#212121;--side:#171717;--panel:#2b2b2b;--panel-hover:#303030;--line:#ffffff16;--text:#f4f4f4;--muted:#a3a3a3;--accent:#f29a45;--accent-hover:#ffb36b;--danger:#ff7777}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}button,textarea{font:inherit}button{color:inherit}
    .app{height:100dvh;display:flex}.sidebar{width:280px;background:var(--side);display:flex;flex-direction:column;padding:14px 12px;flex-shrink:0;z-index:5;border-right:1px solid #ffffff08}
    .side-top{display:flex;align-items:center;justify-content:space-between;padding:3px 4px 18px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.4px}.brand-icon{width:34px;height:34px;border-radius:12px;background:linear-gradient(145deg,#ffc27d,#e77b2d);color:#24170f;display:grid;place-items:center}.brand-icon svg{width:21px;height:21px}.side-action,.icon-btn{width:38px;height:38px;border:1px solid transparent;border-radius:11px;background:transparent;display:grid;place-items:center;cursor:pointer;color:#c5c5c5;transition:.18s}.side-action:hover,.icon-btn:hover{background:#ffffff12;color:white}.side-action svg,.icon-btn svg{width:18px;height:18px}
    .new-chat{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:1px solid #ffffff22;border-radius:12px;background:transparent;text-align:left;cursor:pointer;font-size:13px;font-weight:600;transition:.18s}.new-chat:hover{background:#ffffff0b}.new-chat svg{width:17px;height:17px;color:var(--accent)}
    .history-label{font-size:11px;color:#888;padding:23px 10px 9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}.history{overflow:auto;flex:1;min-height:0}.history-empty{color:#777;font-size:12px;line-height:1.6;padding:8px 10px}.history-item{display:flex;align-items:center;gap:5px;margin:2px 0}.history-select{min-width:0;flex:1;border:0;border-radius:9px;padding:10px;background:transparent;text-align:left;color:#d6d6d6;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.history-item:hover,.history-item.active{background:#ffffff12}.history-item.active .history-select{color:#fff}.delete-chat{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#888;display:grid;place-items:center;cursor:pointer;opacity:0}.history-item:hover .delete-chat{opacity:1}.delete-chat:hover{color:var(--danger);background:#ff77771a}.delete-chat svg{width:15px;height:15px}
    .side-bottom{padding:12px 8px 2px;border-top:1px solid #ffffff12;color:#777;font-size:11px;line-height:1.5}.side-bottom span{color:#aaa}
    .main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #ffffff0a;flex-shrink:0}.top-left{display:flex;align-items:center;gap:10px}.mobile-menu{display:none}.top-title{font-size:13px;font-weight:700;color:#e5e5e5}.model-label{font-size:11px;color:#999;background:#ffffff0b;border:1px solid #ffffff12;padding:6px 9px;border-radius:8px}
    .content{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}.welcome{margin:auto;text-align:center;padding:35px 20px 55px;max-width:680px}.welcome-mark{width:76px;height:76px;border-radius:27px;background:linear-gradient(145deg,#ffc27d,#e77b2d);color:#24170f;display:grid;place-items:center;margin:0 auto 24px;box-shadow:0 15px 48px #e77b2d26}.welcome-mark svg{width:42px;height:42px}.welcome h1{font-size:clamp(27px,4vw,38px);letter-spacing:-1.3px;margin:0 0 11px}.welcome p{font-size:14px;color:#a6a6a6;line-height:1.7;margin:0 0 25px}.suggestions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.suggestion{background:#ffffff08;border:1px solid #ffffff1b;border-radius:13px;padding:10px 13px;color:#d1d1d1;font-size:12px;cursor:pointer;transition:.18s}.suggestion:hover{background:#f29a4512;border-color:#f29a4570}
    .chat{display:none;flex:1;overflow:auto;padding:28px 22px 24px;scroll-behavior:smooth}.chat.active{display:block}.message{display:flex;gap:13px;max-width:790px;margin:0 auto 25px;animation:rise .2s ease}.message.user{justify-content:flex-end}.avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;background:#f29a4520;color:#ffbd75;display:grid;place-items:center;margin-top:2px}.avatar svg{width:17px;height:17px}.message.user .avatar{display:none}.bubble{max-width:min(83%,690px);font-size:14px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;color:#e8e8e8}.message.user .bubble{background:#303030;border:1px solid #ffffff12;border-radius:20px;padding:11px 16px;color:#f5f5f5}.message.error .bubble{color:#ffaaa3;background:#ff777710;border:1px solid #ff77772b;border-radius:12px;padding:10px 13px}.typing{display:inline-flex;gap:5px;padding:9px 2px}.typing i{width:6px;height:6px;border-radius:50%;background:#c9a17c;animation:pulse 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
    .composer-area{padding:12px 20px max(18px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 15%);flex-shrink:0}.composer{max-width:790px;margin:auto;border:1px solid #ffffff28;background:#2b2b2b;border-radius:25px;padding:10px 11px 10px 18px;display:flex;align-items:flex-end;gap:10px;box-shadow:0 12px 35px #0002;transition:.18s}.composer:focus-within{border-color:#a66a3c;box-shadow:0 0 0 3px #f29a4510}textarea{flex:1;resize:none;outline:0;border:0;background:transparent;color:var(--text);min-height:28px;max-height:160px;padding:7px 0;line-height:1.5;font-size:14px}textarea::placeholder{color:#929292}.send{width:39px;height:39px;border:0;border-radius:50%;background:#f1f1f1;color:#202020;display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:.18s}.send:hover{background:#fff;transform:translateY(-1px)}.send:disabled{opacity:.35;cursor:default;transform:none}.send svg{width:19px;height:19px}.composer-note{text-align:center;color:#777;font-size:10px;margin:9px 0 0}
    .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#343434;border:1px solid #ffffff20;padding:11px 15px;border-radius:12px;font-size:12px;transition:.2s;z-index:10;max-width:calc(100vw - 30px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.backdrop{display:none}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes pulse{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
    @media(max-width:720px){.sidebar{position:fixed;left:0;top:0;bottom:0;width:min(290px,86vw);transform:translateX(-102%);transition:transform .22s ease;box-shadow:15px 0 50px #0005}.sidebar.open{transform:translateX(0)}.backdrop.show{display:block;position:fixed;inset:0;background:#0009;z-index:4}.mobile-menu{display:grid}.topbar{padding:0 13px}.chat{padding:22px 14px}.composer-area{padding-left:12px;padding-right:12px}.welcome{padding:30px 18px 45px}.welcome p{font-size:13px}.suggestion{font-size:11px}.delete-chat{opacity:1}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <div class="brand"><div class="brand-icon"><i data-lucide="paw-print"></i></div><span>OuškoAI</span></div>
      <button class="side-action" id="collapse" aria-label="Zavřít nabídku" title="Zavřít"><i data-lucide="panel-left-close"></i></button>
    </div>
    <button class="new-chat" id="newChat"><i data-lucide="square-pen"></i><span>Nový chat</span></button>
    <div class="history-label">Historie</div>
    <div class="history" id="historyList"><div class="history-empty">Zatím tu nejsou žádné konverzace.</div></div>
    <div class="side-bottom">Konverzace se ukládají <span>v tomto prohlížeči</span>.</div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <section class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="icon-btn mobile-menu" id="menu" aria-label="Otevřít historii"><i data-lucide="menu"></i></button>
        <div class="top-title" id="topTitle">Nový chat</div>
      </div>
      <div class="model-label">Claude Sonnet 5.5</div>
    </header>
    <main class="content">
      <section class="welcome" id="welcome">
        <div class="welcome-mark"><i data-lucide="paw-print"></i></div>
        <h1>Ahoj, já jsem Ouško. 🦊</h1>
        <p>Co dnes společně vymyslíme?</p>
        <div class="suggestions">
          <button class="suggestion">Vymysli mi nový projekt</button>
          <button class="suggestion">Vysvětli mi něco zajímavého</button>
          <button class="suggestion">Pojďme si povídat</button>
        </div>
      </section>
      <section class="chat" id="chat" aria-live="polite"></section>
    </main>
    <div class="composer-area">
      <form class="composer" id="form">
        <textarea id="prompt" rows="1" maxlength="8000" placeholder="Napiš Ouškovi zprávu…" aria-label="Zpráva"></textarea>
        <button class="send" id="send" type="submit" aria-label="Odeslat"><i data-lucide="arrow-up"></i></button>
      </form>
      <div class="composer-note">OuškoAI může občas udělat chybu. Důležité informace si ověř.</div>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
  const SUPABASE_URL = "https://knpkaoddloxtzdtzwjle.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsIm5hbWUiOiJrbnBrYW9kZGxveHR6ZHR6d2psZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg1MTQwNTQxLCJleHAiOjIxMDA3MTY1NDF9.opr571bbJvx890hQ0BFYRDrwWIgYncuYYEcn2Rdt3Kg";
  const STORAGE_KEY = "ouskoai.conversations.v2";
  const $ = (selector) => document.querySelector(selector);
  const sidebar = $("#sidebar"), backdrop = $("#backdrop"), welcome = $("#welcome"), chat = $("#chat");
  const promptBox = $("#prompt"), sendButton = $("#send"), historyList = $("#historyList"), toast = $("#toast");
  let conversations = loadConversations();
  let activeId = null;
  let busy = false;

  function loadConversations() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return Array.isArray(saved) ? saved.filter(c => c && typeof c.id === "string" && Array.isArray(c.messages)) : [];
    } catch { return []; }
  }
  function saveConversations() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations)); }
    catch { notify("Historii se nepodařilo uložit. V prohlížeči může být plné úložiště."); }
  }
  function icons() { if (window.lucide) lucide.createIcons(); }
  function notify(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(notify.timer);
    notify.timer = setTimeout(() => toast.classList.remove("show"), 3200);
  }
  function currentConversation() { return conversations.find(c => c.id === activeId) || null; }
  function makeId() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2); }
  function newConversation() {
    const conversation = { id: makeId(), title: "Nový chat", updatedAt: Date.now(), messages: [] };
    conversations.unshift(conversation);
    activeId = conversation.id;
    saveConversations();
    renderHistory();
    renderConversation();
    closeSidebar();
    promptBox.focus();
  }
  function selectConversation(id) {
    if (busy) return;
    activeId = id;
    renderHistory();
    renderConversation();
    closeSidebar();
  }
  function deleteConversation(id) {
    if (busy && activeId === id) return notify("Počkej, až Ouško dopoví.");
    conversations = conversations.filter(c => c.id !== id);
    if (activeId === id) activeId = null;
    saveConversations();
    renderHistory();
    renderConversation();
  }
  function renderHistory() {
    historyList.replaceChildren();
    if (!conversations.length) {
      const empty = document.createElement("div");
      empty.className = "history-empty";
      empty.textContent = "Zatím tu nejsou žádné konverzace.";
      historyList.append(empty);
      return;
    }
    [...conversations].sort((a,b) => b.updatedAt - a.updatedAt).forEach(item => {
      const row = document.createElement("div");
      row.className = "history-item" + (item.id === activeId ? " active" : "");
      const select = document.createElement("button");
      select.className = "history-select";
      select.textContent = item.title || "Nový chat";
      select.title = item.title || "Nový chat";
      select.addEventListener("click", () => selectConversation(item.id));
      const remove = document.createElement("button");
      remove.className = "delete-chat";
      remove.type = "button";
      remove.title = "Smazat konverzaci";
      remove.setAttribute("aria-label", "Smazat konverzaci");
      remove.innerHTML = '<i data-lucide="trash-2"></i>';
      remove.addEventListener("click", e => { e.stopPropagation(); deleteConversation(item.id); });
      row.append(select, remove);
      historyList.append(row);
    });
    icons();
  }
  function renderConversation() {
    const conversation = currentConversation();
    chat.replaceChildren();
    if (!conversation || !conversation.messages.length) {
      chat.classList.remove("active");
      welcome.style.display = "block";
      $("#topTitle").textContent = "Nový chat";
      return;
    }
    welcome.style.display = "none";
    chat.classList.add("active");
    $("#topTitle").textContent = conversation.title;
    conversation.messages.forEach(message => appendMessage(message.role, message.content, message.error));
    chat.scrollTop = chat.scrollHeight;
  }
  function appendMessage(role, text, isError = false) {
    const wrap = document.createElement("div");
    wrap.className = "message " + role + (isError ? " error" : "");
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.innerHTML = role === "user" ? '<i data-lucide="user-round"></i>' : '<i data-lucide="paw-print"></i>';
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.append(avatar, bubble);
    chat.append(wrap);
    icons();
    chat.scrollTop = chat.scrollHeight;
    return wrap;
  }
  function setBusy(value) {
    busy = value;
    sendButton.disabled = value;
    promptBox.disabled = value;
  }
  async function sendMessage(text) {
    const value = text.trim();
    if (!value || busy) return;
    if (!activeId || !currentConversation()) {
      const conversation = { id: makeId(), title: "Nový chat", updatedAt: Date.now(), messages: [] };
      conversations.unshift(conversation);
      activeId = conversation.id;
    }
    const conversation = currentConversation();
    conversation.messages.push({ role: "user", content: value });
    if (conversation.title === "Nový chat") {
      conversation.title = value.replace(/\s+/g, " ").slice(0, 42) + (value.length > 42 ? "…" : "");
    }
    conversation.updatedAt = Date.now();
    saveConversations();
    renderHistory();
    promptBox.value = "";
    promptBox.style.height = "auto";
    renderConversation();
    const typing = appendMessage("assistant", "");
    typing.querySelector(".bubble").innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    setBusy(true);
    try {
      const response = await fetch(SUPABASE_URL + "/functions/v1/ousko-chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY },
        body: JSON.stringify({ messages: conversation.messages.slice(-20).map(m => ({ role: m.role, content: m.content })) })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        let message = data.error || "Server vrátil chybu (" + response.status + ").";
        if (response.status === 401 || response.status === 403) message = "Supabase odmítl přístup. Zkontroluj nastavení Edge Function a veřejného klíče.";
        if (response.status === 503) message = data.error || "Na serveru chybí ANTHROPIC_API_KEY. Je potřeba ho nastavit v Supabase Secrets.";
        throw new Error(message);
      }
      if (typeof data.reply !== "string" || !data.reply.trim()) throw new Error("Ouško zatím neposlal odpověď.");
      conversation.messages.push({ role: "assistant", content: data.reply });
      conversation.updatedAt = Date.now();
      saveConversations();
      typing.querySelector(".bubble").textContent = data.reply;
      renderHistory();
    } catch (error) {
      typing.remove();
      const message = error instanceof TypeError ? "Nepodařilo se spojit se serverem. Zkontroluj připojení a nastavení Supabase." : (error.message || "Nepodařilo se spojit s Ouškem.");
      appendMessage("assistant", message, true);
    } finally {
      setBusy(false);
      promptBox.focus();
      chat.scrollTop = chat.scrollHeight;
    }
  }
  function openSidebar() { sidebar.classList.add("open"); backdrop.classList.add("show"); }
  function closeSidebar() { sidebar.classList.remove("open"); backdrop.classList.remove("show"); }

  $("#newChat").addEventListener("click", newConversation);
  $("#menu").addEventListener("click", openSidebar);
  $("#collapse").addEventListener("click", closeSidebar);
  backdrop.addEventListener("click", closeSidebar);
  $("#form").addEventListener("submit", e => { e.preventDefault(); sendMessage(promptBox.value); });
  promptBox.addEventListener("input", () => { promptBox.style.height = "auto"; promptBox.style.height = Math.min(promptBox.scrollHeight, 160) + "px"; });
  promptBox.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#form").requestSubmit(); } });
  document.querySelectorAll(".suggestion").forEach(button => button.addEventListener("click", () => sendMessage(button.textContent)));
  renderHistory();
  if (conversations.length) selectConversation([...conversations].sort((a,b) => b.updatedAt - a.updatedAt)[0].id);
  icons();
</script>
</body>
</html>
